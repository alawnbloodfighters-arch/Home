<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>আল-আওন ব্লাড ফাইটার্স</title>

    <link rel="stylesheet" href="style.css">


    <!-- বাংলা ফন্ট -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <!-- BUTTON TITLE FONT -->

    <style>

        .action-card .card-content h3 {

            font-size: 25px;

            font-weight: 700;

            line-height: 1.15;

            margin: 0;

            letter-spacing: -0.5px;

        }

    </style>

</head>


<body>


<div class="app">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="top-header">

        <div class="brand">

            <div class="logo-box">

                <img
                    src="logo.png"
                    alt="Al-Awn Blood Fighters Logo"
                >

            </div>


            <div class="brand-text">

                <h1>

                    আল-আওন ব্লাড<br>
                    ফাইটার্স

                </h1>


                <p>

                    AABF • Feni + Cumilla

                </p>

            </div>

        </div>

    </header>



    <!-- =========================
         USER / LOGIN
    ========================== -->

    <section
        class="user-card"
        id="userCard"
        onclick="login()"
    >

        <div class="user-icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <div class="user-info">

            <span class="welcome">

                স্বাগতম

            </span>


            <h2 id="userName">

                ব্যবহারকারী

            </h2>


            <p>

                AABF ID :
                <b id="userAabfId">Login করুন</b>

            </p>

        </div>


        <div class="user-arrow">

            <i class="fa-solid fa-arrow-right"></i>

        </div>

    </section>



    <!-- =========================
         MAIN MENU
    ========================== -->

    <main class="button-grid">


        <!-- =====================
             পরিচিতি
        ====================== -->

        <button
            class="action-card card-pink"
            type="button"
            onclick="goTo('porichiti.html')"
        >

            <div class="card-icon">

                <i class="fa-regular fa-address-card"></i>

            </div>


            <div class="card-content">

                <h3>

                    পরিচিতি

                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>



        <!-- =====================
             রক্তের আবেদন
        ====================== -->

        <button
            class="action-card card-green"
            type="button"
            onclick="goTo('blood-request.html')"
        >

            <div class="card-icon">

                <i class="fa-solid fa-droplet"></i>

            </div>


            <div class="card-content">

                <h3>

                    রক্তের<br>
                    আবেদন

                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>



        <!-- =====================
             আবেদন দেখুন
        ====================== -->

        <button
            class="action-card card-blue"
            type="button"
            onclick="goTo('blood-requests.html')"
        >

            <div class="card-icon">

                <i class="fa-solid fa-file-medical"></i>

            </div>


            <div class="card-content">

                <h3>

                    আবেদন<br>
                    দেখুন

                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>



        <!-- =====================
             সদস্য নিবন্ধন
        ====================== -->

        <button
            class="action-card card-purple"
            type="button"
            onclick="goTo('registration.html')"
        >

            <div class="card-icon">

                <i class="fa-solid fa-user-plus"></i>

            </div>


            <div class="card-content">

                <h3>

                    সদস্য<br>
                    নিবন্ধন

                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>


    </main>



    <!-- =========================
         RELIEF
    ========================== -->

    <button
        class="relief-card"
        type="button"
        onclick="window.location.href='https://alawnbloodfighters-arch.github.io/Home/donation.html'"
    >

        <div class="relief-icon">

            <i class="fa-solid fa-hands-holding-child"></i>

        </div>


        <div class="relief-content">

            <h3>

                ত্রাণ সহায়তা

            </h3>


            <p>

                সংগঠনকে অর্থ সাহায্য করুন

            </p>

        </div>


        <div class="relief-arrow">

            <i class="fa-solid fa-arrow-right"></i>

        </div>

    </button>



    <!-- =========================
         EMERGENCY
    ========================== -->

    <button
        class="emergency-btn"
        type="button"
        onclick="emergency()"
    >

        <div class="emergency-icon">

            <i class="fa-solid fa-phone"></i>

        </div>


        <div class="emergency-text">

            <h3>

                Emergency

            </h3>


            <p>

                জরুরি সহায়তা প্রয়োজন?

            </p>

        </div>


        <div class="emergency-arrow">

            <i class="fa-solid fa-arrow-right"></i>

        </div>

    </button>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <span>

            Al-Awn Blood Fighters

        </span>


        <b>

            •

        </b>


        <span>

            AABF

        </span>

    </footer>


</div>



<!-- =========================
     HOME SCRIPT
========================= -->

<script type="module">

    import {
        initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


    import {
        getAuth,
        onAuthStateChanged
    }
    from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


    import {
        getDatabase,
        ref,
        get
    }
    from
    "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


    // ===============================
    // Firebase Configuration
    // ===============================

    const firebaseConfig = {

        apiKey:
            "AIzaSyAR3uyMlvGNWZaG_w1zs6IKQ2lXB_Y_9M0",

        authDomain:
            "al-awn-blood-fighters.firebaseapp.com",

        projectId:
            "al-awn-blood-fighters",

        storageBucket:
            "al-awn-blood-fighters.firebasestorage.app",

        messagingSenderId:
            "299061496611",

        appId:
            "1:299061496611:web:4762f74dbf311cd57f1a96",

        measurementId:
            "G-D31EXKJWQ3"

    };


    // ===============================
    // Initialize Firebase
    // ===============================

    const app =
        initializeApp(firebaseConfig);


    const auth =
        getAuth(app);


    const db =
        getDatabase(app);


    // ===============================
    // User Profile
    // ===============================

    const userName =
        document.getElementById("userName");


    const userAabfId =
        document.getElementById("userAabfId");


    // ===============================
    // Check Login User
    // ===============================

    onAuthStateChanged(
        auth,
        async function(user) {


            // =========================
            // User Login করা নেই
            // =========================

            if (!user) {

                userName.textContent =
                    "ব্যবহারকারী";

                userAabfId.textContent =
                    "Login করুন";

                return;

            }


            // =========================
            // Firebase User UID
            // =========================

            const uid =
                user.uid;


            try {


                // =========================
                // Get User Profile
                // =========================

                const userRef =
                    ref(
                        db,
                        "users/" + uid
                    );


                const snapshot =
                    await get(userRef);


                if (
                    snapshot.exists()
                ) {


                    const profile =
                        snapshot.val();


                    // =====================
                    // User Name
                    // =====================

                    userName.textContent =
                        profile.name ||
                        "ব্যবহারকারী";


                    // =====================
                    // AABF ID
                    // =====================

                    userAabfId.textContent =
                        profile.aabfID ||
                        "AABF ID নেই";


                } else {


                    userName.textContent =
                        "ব্যবহারকারী";


                    userAabfId.textContent =
                        "Profile পাওয়া যায়নি";

                }


            }


            catch (error) {


                console.error(
                    "Profile Load Error:",
                    error
                );


                userName.textContent =
                    "ব্যবহারকারী";


                userAabfId.textContent =
                    "Login করুন";

            }

        }
    );


</script>


<!-- =========================
     NORMAL HOME SCRIPT
========================= -->

<script src="script.js"></script>


</body>

</html>
