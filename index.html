<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আল-আওন ব্লাড ফাইটার্স AABF</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- TOP HEADER -->
    <header class="top-header">

      <div class="brand">
        <div class="brand-logo">
          <img src="logo.png" alt="AABF Logo">
        </div>

        <div class="brand-text">
          <h1>আল-আওন ব্লাড ফাইটার্স</h1>
          <p>AABF • Feni + Cumilla</p>
        </div>
      </div>

      <!-- Organization Logo -->
      <div class="org-logo">
        <img src="logo.png" alt="AABF">
      </div>

    </header>


    <!-- PROFILE CARD -->
    <section class="profile-card">

      <div class="profile-avatar">
        <span>👤</span>
      </div>

      <div class="profile-info">

        <small>স্বাগতম</small>

        <h2>ব্যবহারকারী</h2>

        <p>
          AABF ID :
          <strong id="aabfId">Login করুন</strong>
        </p>

      </div>

      <button class="profile-arrow" onclick="openProfile()">
        →
      </button>

    </section>


    <!-- MAIN BUTTONS -->
    <section class="menu-grid">

      <!-- পরিচিতি -->
      <button class="menu-card identity" onclick="openPage('porichiti.html')">

        <div class="icon-box">
          <span>🪪</span>
        </div>

        <div class="menu-content">
          <h3>পরিচিতি</h3>
          <p>সদস্যের বিস্তারিত তথ্য দেখুন</p>
        </div>

        <div class="arrow">→</div>

      </button>


      <!-- রক্তের আবেদন -->
      <button class="menu-card blood" onclick="openPage('blood-request.html')">

        <div class="icon-box">
          <span>🩸</span>
        </div>

        <div class="menu-content">
          <h3>রক্তের আবেদন</h3>
          <p>জরুরি রক্তের জন্য আবেদন করুন</p>
        </div>

        <div class="arrow">→</div>

      </button>


      <!-- সদস্য নিবন্ধন -->
      <button class="menu-card registration" onclick="openPage('registration.html')">

        <div class="icon-box">
          <span>👥</span>
        </div>

        <div class="menu-content">
          <h3>সদস্য নিবন্ধন</h3>
          <p>AABF-এর নতুন সদস্য হন</p>
        </div>

        <div class="arrow">→</div>

      </button>


      <!-- ত্রাণ সহায়তা -->
      <button class="menu-card relief" onclick="openPage('relief.html')">

        <div class="icon-box">
          <span>🤝</span>
        </div>

        <div class="menu-content">
          <h3>ত্রাণ সহায়তা</h3>
          <p>সহায়তার জন্য আবেদন করুন</p>
        </div>

        <div class="arrow">→</div>

      </button>

    </section>


    <!-- EMERGENCY -->
    <button class="emergency" onclick="emergencyCall()">

      <div class="emergency-icon">
        ☎
      </div>

      <div class="emergency-text">
        <strong>Emergency</strong>
        <span>জরুরি সহায়তা</span>
      </div>

      <div class="emergency-arrow">
        →
      </div>

    </button>


    <!-- FOOTER -->
    <footer>
      <span>Al-Awn Blood Fighters</span>
      <b>•</b>
      <span>AABF</span>
    </footer>

  </main>

  <script src="script.js"></script>

</body>
</html>
