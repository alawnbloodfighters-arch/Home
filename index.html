<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>আল-আওন ব্লাড ফাইটার্স</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <!-- ================= HEADER ================= -->
    <header class="top-header">

      <div class="brand">

        <div class="logo-box">
          <img src="logo.png" alt="AABF Logo">
        </div>

        <div class="brand-text">
          <h1>আল-আওন ব্লাড ফাইটার্স</h1>
          <p>AABF • Feni + Cumilla</p>
        </div>

      </div>

      <button class="profile-button" onclick="openLogin()">

        <div class="profile-icon">
          <!-- Profile SVG -->
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="3.5"></circle>
            <path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"></path>
          </svg>
        </div>

        <span>প্রোফাইল</span>

      </button>

    </header>


    <!-- ================= USER PROFILE ================= -->
    <section class="user-card" onclick="openLogin()">

      <div class="user-avatar">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="3.5"></circle>
          <path d="M5 20c.5-4 3-6 7-6s6.5 2 7 6"></path>
        </svg>
      </div>

      <div class="user-info">

        <small>স্বাগতম</small>

        <h2 id="userName">ব্যবহারকারী</h2>

        <p>
          AABF ID :
          <strong id="userId">Login করুন</strong>
        </p>

      </div>

      <div class="user-arrow">
        →
      </div>

    </section>


    <!-- ================= MAIN BUTTONS ================= -->
    <section class="menu-grid">

      <!-- পরিচিতি -->
      <button class="menu-card identity" onclick="openPage('পরিচিতি')">

        <div class="card-icon">

          <!-- ID Card SVG -->
          <svg viewBox="0 0 24 24">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <circle cx="8" cy="10" r="2"></circle>
            <path d="M5.5 16c.4-2 1.4-3 2.5-3s2.1 1 2.5 3"></path>
            <path d="M13 9h5"></path>
            <path d="M13 12h5"></path>
            <path d="M13 15h3"></path>
          </svg>

        </div>

        <div class="card-content">
          <h3>পরিচিতি</h3>
          <p>সদস্যের বিস্তারিত তথ্য দেখুন</p>
        </div>

        <span class="card-arrow">→</span>

      </button>


      <!-- রক্তের আবেদন করুন -->
      <button class="menu-card blood-request"
              onclick="openPage('রক্তের আবেদন করুন')">

        <div class="card-icon">

          <!-- Blood Drop SVG -->
          <svg viewBox="0 0 24 24">
            <path d="M12 2S5 9 5 14a7 7 0 0 0 14 0c0-5-7-12-7-12z"></path>
            <path d="M9 15c.4 1.4 1.4 2.3 3 2.7"></path>
            <path d="M15 11v5"></path>
            <path d="M12.5 13.5h5"></path>
          </svg>

        </div>

        <div class="card-content">
          <h3>রক্তের আবেদন করুন</h3>
          <p>জরুরি রক্তের জন্য আবেদন করুন</p>
        </div>

        <span class="card-arrow">→</span>

      </button>


      <!-- রক্তের আবেদনগুলি দেখুন -->
      <button class="menu-card blood-list"
              onclick="openPage('রক্তের আবেদনগুলি দেখুন')">

        <div class="card-icon">

          <!-- Blood List/Search SVG -->
          <svg viewBox="0 0 24 24">
            <rect x="4" y="3" width="12" height="18" rx="2"></rect>
            <path d="M8 7h5"></path>
            <path d="M8 10h5"></path>
            <path d="M8 13h3"></path>
            <circle cx="17" cy="16" r="3"></circle>
            <path d="M19.2 18.2L21 20"></path>
          </svg>

        </div>

        <div class="card-content">
          <h3>রক্তের আবেদনগুলি দেখুন</h3>
          <p>সকল রক্তের আবেদন দেখুন</p>
        </div>

        <span class="card-arrow">→</span>

      </button>


      <!-- সদস্য নিবন্ধন -->
      <button class="menu-card registration"
              onclick="openPage('সদস্য নিবন্ধন')">

        <div class="card-icon">

          <!-- Users Plus SVG -->
          <svg viewBox="0 0 24 24">
            <circle cx="9" cy="8" r="3"></circle>
            <path d="M3.5 19c.5-3.5 2.4-5.5 5.5-5.5s5 2 5.5 5.5"></path>
            <path d="M17 8v6"></path>
            <path d="M14 11h6"></path>
          </svg>

        </div>

        <div class="card-content">
          <h3>সদস্য নিবন্ধন</h3>
          <p>AABF-এর নতুন সদস্য হন</p>
        </div>

        <span class="card-arrow">→</span>

      </button>


      <!-- ত্রাণ সহায়তা -->
      <button class="menu-card relief"
              onclick="openPage('ত্রাণ সহায়তা')">

        <div class="card-icon">

          <!-- Helping Hands / Heart SVG -->
          <svg viewBox="0 0 24 24">
            <path d="M4 13l3-3 4 4 2-2 3 3"></path>
            <path d="M3 15l2 4h5l2-2"></path>
            <path d="M21 15l-2 4h-5l-2-2"></path>
            <path d="M12 8c-2-3-6-1.8-6 1.2 0 2.5 3 3.8 6 6 3-2.2 6-3.5 6-6C18 6.2 14 5 12 8z"></path>
          </svg>

        </div>

        <div class="card-content">
          <h3>ত্রাণ সহায়তা</h3>
          <p>সহায়তার জন্য আবেদন করুন</p>
        </div>

        <span class="card-arrow">→</span>

      </button>

    </section>


    <!-- ================= EMERGENCY ================= -->
    <button class="emergency" onclick="openEmergency()">

      <div class="emergency-icon">

        <svg viewBox="0 0 24 24">
          <path d="M6 7.5a9 9 0 0 1 12 0"></path>
          <path d="M8 10a6 6 0 0 1 8 0"></path>
          <path d="M10 12.5a3 3 0 0 1 4 0"></path>
          <circle cx="12" cy="17" r="2"></circle>
        </svg>

      </div>

      <div class="emergency-text">
        <strong>Emergency</strong>
        <span>জরুরি সহায়তা</span>
      </div>

      <span class="emergency-arrow">→</span>

    </button>


    <!-- ================= FOOTER ================= -->
    <footer>
      Al-Awn Blood Fighters
      <span>•</span>
      AABF
    </footer>

  </main>


  <!-- ================= LOGIN MODAL ================= -->
  <div class="modal" id="loginModal">

    <div class="modal-box">

      <button class="close-modal" onclick="closeLogin()">×</button>

      <div class="modal-logo">
        <img src="logo.png" alt="AABF">
      </div>

      <h2>প্রোফাইলে লগইন</h2>

      <p>আপনার AABF ID লিখুন</p>

      <input
        type="text"
        id="loginId"
        placeholder="AABF ID"
        autocomplete="off"
      >

      <input
        type="text"
        id="loginName"
        placeholder="আপনার নাম"
        autocomplete="off"
      >

      <button class="login-submit" onclick="loginUser()">
        লগইন করুন
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
