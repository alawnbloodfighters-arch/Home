<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>আল-আওন ব্লাড ফাইটার্স</title>

    <link rel="stylesheet" href="style.css">

    <!-- বাংলা ফন্ট -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

    <!-- Header -->
    <header class="header">

        <div class="brand">
            <img src="Logo.png" alt="AABF Logo" class="logo">

            <div class="brand-text">
                <h1>আল-আওন ব্লাড ফাইটার্স</h1>
                <p>AABF • Feni + Cumilla</p>
            </div>
        </div>

        <button class="profile-btn" onclick="openProfile()">
            <div class="profile-icon">
                <!-- Profile SVG -->
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M4 21c0-4.2 3.2-7 8-7s8 2.8 8 7"></path>
                </svg>
            </div>
            <span>প্রোফাইল</span>
        </button>

    </header>


    <!-- User Card -->
    <section class="user-card">

        <div class="user-avatar">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="7" r="4"></circle>
                <path d="M4 21c0-4.5 3.3-7 8-7s8 2.5 8 7"></path>
            </svg>
        </div>

        <div class="user-info">
            <span class="welcome">স্বাগতম</span>

            <h2 id="userName">ব্যবহারকারী</h2>

            <p>
                AABF ID :
                <strong id="aabfId" onclick="login()">Login করুন</strong>
            </p>
        </div>

        <button class="user-arrow" onclick="login()">
            →
        </button>

    </section>


    <!-- Main Buttons -->
    <main class="menu-grid">

        <!-- পরিচিতি -->
        <button class="menu-card identity" onclick="openPage('profile')">

            <div class="card-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="16" rx="3"></rect>
                    <circle cx="9" cy="10" r="2"></circle>
                    <path d="M6.5 16c.7-2 4.3-2 5 0"></path>
                    <path d="M14 9h4"></path>
                    <path d="M14 13h4"></path>
                </svg>
            </div>

            <div class="card-content">
                <h3>পরিচিতি</h3>
                <p>সদস্যের বিস্তারিত তথ্য দেখুন</p>
            </div>

            <span class="card-arrow">→</span>

        </button>


        <!-- রক্তের আবেদন করুন -->
        <button class="menu-card blood-request" onclick="openPage('blood-request')">

            <div class="card-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 3S5 10.2 5 15a7 7 0 0 0 14 0c0-4.8-7-12-7-12z"></path>
                    <path d="M12 11v6"></path>
                    <path d="M9 14h6"></path>
                </svg>
            </div>

            <div class="card-content">
                <h3>রক্তের আবেদন করুন</h3>
                <p>জরুরি রক্তের জন্য আবেদন করুন</p>
            </div>

            <span class="card-arrow">→</span>

        </button>


        <!-- রক্তের আবেদনগুলি দেখুন -->
        <button class="menu-card blood-list" onclick="openPage('blood-list')">

            <div class="card-icon">
                <svg viewBox="0 0 24 24">
                    <rect x="5" y="3" width="14" height="18" rx="2"></rect>
                    <path d="M8 8h8"></path>
                    <path d="M8 12h5"></path>
                    <path d="M8 16h4"></path>
                    <circle cx="18" cy="17" r="3"></circle>
                    <path d="M20.2 19.2L22 21"></path>
                </svg>
            </div>

            <div class="card-content">
                <h3>রক্তের আবেদনগুলি দেখুন</h3>
                <p>সকল রক্তের আবেদন দেখুন</p>
            </div>

            <span class="card-arrow">→</span>

        </button>


        <!-- সদস্য নিবন্ধন -->
        <button class="menu-card registration" onclick="openPage('registration')">

            <div class="card-icon">
                <svg viewBox="0 0 24 24">
                    <circle cx="10" cy="8" r="3.5"></circle>
                    <path d="M3.5 21c0-4 2.8-6.5 6.5-6.5s6.5 2.5 6.5 6.5"></path>
                    <path d="M19 8v6"></path>
                    <path d="M16 11h6"></path>
                </svg>
            </div>

            <div class="card-content">
                <h3>সদস্য নিবন্ধন</h3>
                <p>AABF-এর নতুন সদস্য হন</p>
            </div>

            <span class="card-arrow">→</span>

        </button>


        <!-- ত্রাণ সহায়তা -->
        <button class="menu-card relief" onclick="openPage('relief')">

            <div class="card-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M4 14c2-2 4-2 6 0l2 2 2-2c2-2 4-2 6 0"></path>
                    <path d="M3 17l4 4 5-3 5 3 4-4"></path>
                    <path d="M8 10l2-2 2 2 2-2 2 2"></path>
                </svg>
            </div>

            <div class="card-content">
                <h3>ত্রাণ সহায়তা</h3>
                <p>সহায়তার জন্য আবেদন করুন</p>
            </div>

            <span class="card-arrow">→</span>

        </button>

    </main>


    <!-- Emergency -->
    <button class="emergency" onclick="emergencyCall()">

        <div class="emergency-icon">
            <svg viewBox="0 0 24 24">
                <path d="M6 4h3l2 5-2 2c1 2 2 3 4 4l2-2 5 2v3c0 1-1 2-2 2C10 20 4 14 4 6c0-1 1-2 2-2z"></path>
            </svg>
        </div>

        <div class="emergency-text">
            <strong>Emergency</strong>
            <span>জরুরি সহায়তা প্রয়োজন?</span>
        </div>

        <span class="emergency-arrow">→</span>

    </button>


    <footer>
        Al-Awn Blood Fighters <span>•</span> AABF
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
