<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>AABF</title>

  <!-- Bengali Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="app">


    <!-- TOP SECTION -->

    <section class="top-section">

      <div>

        <div class="brand">
          AABF
        </div>

        <div class="brand-subtitle">
          আল-আওন ব্লাড ফাইটার্স
        </div>

      </div>


      <!-- PROFILE -->

      <button
        class="profile-button"
        id="profileButton"
        aria-label="Profile"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >

          <circle
            cx="12"
            cy="8"
            r="3.5"
          />

          <path
            d="M5 20c.8-3.4 3.1-5.2 7-5.2s6.2 1.8 7 5.2"
          />

        </svg>

      </button>

    </section>



    <!-- PROFILE POPUP -->

    <div
      class="profile-box"
      id="profileBox"
    >

      <div class="profile-heading">
        আপনার প্রোফাইল
      </div>

      <div class="profile-aabf">
        AABF ID:
        <strong id="profileAABFID">
          Loading...
        </strong>
      </div>

      <button
        class="logout"
        id="logoutButton"
      >
        লগআউট
      </button>

    </div>



    <!-- AABF ID -->

    <section class="identity">

      <div class="identity-label">
        AABF MEMBER ID
      </div>

      <div
        class="identity-number"
        id="aabfID"
      >
        Loading...
      </div>

      <div
        class="status"
        id="status"
      >
        তথ্য লোড হচ্ছে...
      </div>

    </section>



    <!-- MAIN MENU -->

    <section class="menu-grid">


      <!-- পরিচিতি -->

      <button
        class="menu-card card-profile"
        onclick="openPage('porichiti')"
      >

        <div class="card-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >

            <rect
              x="3"
              y="4"
              width="18"
              height="16"
              rx="3"
            />

            <circle
              cx="9"
              cy="10"
              r="2.2"
            />

            <path
              d="M5.8 16c.7-2 1.8-3 3.2-3s2.5 1 3.2 3"
            />

            <path
              d="M14.5 9h4"
            />

            <path
              d="M14.5 13h4"
            />

          </svg>

        </div>

        <div class="card-content">

          <span class="card-title">
            পরিচিতি
          </span>

          <span class="card-description">
            সদস্যের তথ্য দেখুন
          </span>

        </div>

        <span class="arrow">↗</span>

      </button>



      <!-- রক্তের আবেদন -->

      <button
        class="menu-card card-blood"
        onclick="openPage('blood-request')"
      >

        <div class="card-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >

            <path
              d="M12 3s-6 6.1-6 11a6 6 0 0 0 12 0c0-4.9-6-11-6-11z"
            />

            <path
              d="M9.5 15.5c.5 1.2 1.4 1.8 2.7 1.8"
            />

          </svg>

        </div>

        <div class="card-content">

          <span class="card-title">
            রক্তের আবেদন
          </span>

          <span class="card-description">
            রক্তের জন্য আবেদন করুন
          </span>

        </div>

        <span class="arrow">↗</span>

      </button>



      <!-- সদস্য নিবন্ধন -->

      <button
        class="menu-card card-member"
        onclick="openPage('member-registration')"
      >

        <div class="card-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >

            <circle
              cx="9"
              cy="8"
              r="3"
            />

            <path
              d="M3.8 19c.7-3.3 2.4-5 5.2-5s4.5 1.7 5.2 5"
            />

            <path
              d="M17 9v6"
            />

            <path
              d="M14 12h6"
            />

          </svg>

        </div>

        <div class="card-content">

          <span class="card-title">
            সদস্য নিবন্ধন
          </span>

          <span class="card-description">
            নতুন সদস্য নিবন্ধন করুন
          </span>

        </div>

        <span class="arrow">↗</span>

      </button>



      <!-- ত্রাণ সহায়তা -->

      <button
        class="menu-card card-relief"
        onclick="openPage('relief')"
      >

        <div class="card-icon">

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >

            <path
              d="M4 13c2.5-2 5-2 8 0"
            />

            <path
              d="M20 13c-2.5-2-5-2-8 0"
            />

            <path
              d="M4 13l2 5h5"
            />

            <path
              d="M20 13l-2 5h-5"
            />

            <path
              d="M12 13v5"
            />

            <path
              d="M8 9c1-2 2.3-3 4-3s3 1 4 3"
            />

          </svg>

        </div>

        <div class="card-content">

          <span class="card-title">
            ত্রাণ সহায়তা
          </span>

          <span class="card-description">
            সহায়তা ও ত্রাণ কার্যক্রম
          </span>

        </div>

        <span class="arrow">↗</span>

      </button>


    </section>



    <!-- EMERGENCY -->

    <button
      class="emergency-button"
      id="emergencyButton"
    >

      <span class="emergency-icon">

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >

          <path
            d="M5 4h3l2 5-2 2c1.5 3 3.5 4.5 6 6l2-2 5 2v3c0 1-1 2-3-1-8-2-12-6-14-14C2 6 4 4 5 4z"
          />

        </svg>

      </span>

      <span>
        EMERGENCY
      </span>

    </button>


  </main>


  <!-- JavaScript -->

  <script
    type="module"
    src="script.js"
  ></script>

</body>

</html>
