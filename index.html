<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Al-Awn Blood Fighters AABF</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <main class="app">

    <!-- Top Profile -->
    <section class="top-section">

      <div class="brand">
        <div class="brand-mark">A</div>

        <div>
          <h1>আল-আওন ব্লাড ফাইটার্স</h1>
          <span>AABF • Feni + Cumilla</span>
        </div>
      </div>

      <button class="profile-button" onclick="openProfile()">
        <div class="profile-icon">
          <span>♙</span>
        </div>
        <span>প্রোফাইল</span>
      </button>

    </section>


    <!-- Profile Information -->
    <section class="profile-card" id="profileCard">

      <div class="profile-avatar">
        <span id="profileInitial">A</span>
      </div>

      <div class="profile-info">

        <small>স্বাগতম</small>

        <h2 id="userName">ব্যবহারকারী</h2>

        <p>
          AABF ID :
          <strong id="aabfId">Login করুন</strong>
        </p>

      </div>

      <button class="profile-arrow" onclick="openProfile()">
        ›
      </button>

    </section>


    <!-- Main Actions -->
    <section class="actions">

      <!-- পরিচিতি -->
      <button class="action-card identity"
              onclick="openPage('profile.html')">

        <div class="action-icon">
          <span>◉</span>
        </div>

        <div class="action-text">
          <h3>পরিচিতি</h3>
          <p>সদস্যের বিস্তারিত তথ্য দেখুন</p>
        </div>

        <div class="arrow">→</div>

      </button>


      <!-- রক্তের আবেদন -->
      <button class="action-card blood"
              onclick="openPage('blood-request.html')">

        <div class="action-icon">
          <span>♥</span>
        </div>

        <div class="action-text">
          <h3>রক্তের আবেদন</h3>
          <p>জরুরি রক্তের জন্য আবেদন করুন</p>
        </div>

        <div class="arrow">→</div>

      </button>


      <!-- সদস্য নিবন্ধন -->
      <button class="action-card member"
              onclick="openPage('member-register.html')">

        <div class="action-icon">
          <span>+</span>
        </div>

        <div class="action-text">
          <h3>সদস্য নিবন্ধন</h3>
          <p>AABF-এর নতুন সদস্য হন</p>
        </div>

        <div class="arrow">→</div>

      </button>


      <!-- ত্রাণ সহায়তা -->
      <button class="action-card relief"
              onclick="openPage('relief.html')">

        <div class="action-icon">
          <span>✦</span>
        </div>

        <div class="action-text">
          <h3>ত্রাণ সহায়তা</h3>
          <p>সহায়তার জন্য আবেদন করুন</p>
        </div>

        <div class="arrow">→</div>

      </button>

    </section>


    <!-- Emergency -->
    <button class="emergency-button" onclick="emergencyCall()">

      <div class="emergency-icon">
        ☎
      </div>

      <div>
        <strong>Emergency</strong>
        <small>জরুরি সহায়তা</small>
      </div>

    </button>


    <!-- Footer -->
    <div class="footer">
      <span>Al-Awn Blood Fighters</span>
      <span>•</span>
      <span>AABF</span>
    </div>

  </main>


  <!-- Profile Modal -->
  <div class="modal" id="profileModal">

    <div class="modal-box">

      <button class="close-modal" onclick="closeProfile()">
        ×
      </button>

      <div class="modal-avatar">
        <span id="modalInitial">A</span>
      </div>

      <h2 id="modalName">ব্যবহারকারী</h2>

      <div class="id-box">
        <small>AABF MEMBER ID</small>
        <strong id="modalAabfId">Login করুন</strong>
      </div>

      <button class="login-button" onclick="loginUser()">
        Login / Account
      </button>

    </div>

  </div>


  <script src="script.js"></script>

</body>
</html>
