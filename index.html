<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আল-আওন ব্লাড ফাইটার্স AABF</title>

  <!-- বাংলা Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- CSS File -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app">

    <!-- ================= TOP BAR ================= -->

    <header class="topbar">

      <div class="title">
        আল-আওন ব্লাড ফাইটার্স AABF
      </div>

      <button
        class="menu-button"
        id="profileButton"
        aria-label="Profile"
      >
        ⋮
      </button>

    </header>


    <!-- ================= PROFILE ================= -->

    <div
      class="profile-box"
      id="profileBox"
    >

      <div class="profile-title">
        👤 প্রোফাইল
      </div>

      <div class="profile-id">
        AABF ID:
        <strong id="profileAABFID">
          Loading...
        </strong>
      </div>

      <button
        class="logout"
        id="logoutButton"
      >
        লগআউট
      </button>

    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <section class="content">

      <!-- AABF ID -->

      <div class="aabf-id">

        AABF ID :
        <span id="aabfID">
          Loading...
        </span>

      </div>


      <!-- Firebase Status -->

      <div
        class="status"
        id="status"
      >
        User information loading...
      </div>


      <!-- ================= BUTTONS ================= -->

      <div class="buttons">


        <!-- পরিচিতি -->

        <button
          class="main-button"
          onclick="openPage('porichiti')"
        >

          <div class="icon">
            🪪
          </div>

          <div class="button-text">
            পরিচিতি
          </div>

        </button>


        <hr class="line">


        <!-- রক্তের আবেদন -->

        <button
          class="main-button"
          onclick="openPage('blood-request')"
        >

          <div class="icon">
            🩸
          </div>

          <div class="button-text">
            রক্তের আবেদন
          </div>

        </button>


        <hr class="line">


        <!-- সদস্য নিবন্ধন -->

        <button
          class="main-button"
          onclick="openPage('member-registration')"
        >

          <div class="icon">
            👤
          </div>

          <div class="button-text">
            সদস্য নিবন্ধন
          </div>

        </button>


        <hr class="line">


        <!-- ত্রাণ সহায়তা -->

        <button
          class="main-button"
          onclick="openPage('relief')"
        >

          <div class="icon">
            🤲
          </div>

          <div class="button-text">
            ত্রাণ সহায়তা
          </div>

        </button>

      </div>

    </section>


    <!-- ================= EMERGENCY ================= -->

    <button
      class="emergency"
      id="emergencyButton"
      aria-label="Emergency"
    >
      ☎
    </button>

  </div>


  <!-- ==================================================
       Firebase + Main JavaScript
       ================================================== -->

  <script
    type="module"
    src="script.js"
  ></script>

</body>
</html>
