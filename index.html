<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>আল-আওন ব্লাড ফাইটার্স AABF</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <!-- Header -->
        <header class="top-header">

            <div class="brand">
                <img
                    src="Logo.png"
                    alt="AABF Logo"
                    class="org-logo"
                >

                <div class="brand-text">
                    <h1>আল-আওন ব্লাড ফাইটার্স</h1>
                    <p>AABF • Feni + Cumilla</p>
                </div>
            </div>

            <!-- Profile -->
            <button class="profile-btn" onclick="openProfile()">
                <span class="profile-icon">♙</span>
                <span>প্রোফাইল</span>
            </button>

        </header>


        <!-- User Card -->
        <section class="user-card">

            <div class="user-avatar">
                <span>●</span>
            </div>

            <div class="user-info">
                <p class="welcome">স্বাগতম</p>

                <h2 id="userName">
                    ব্যবহারকারী
                </h2>

                <p class="aabf-id">
                    AABF ID :
                    <strong id="userAabfId">Login করুন</strong>
                </p>
            </div>

            <button class="round-arrow" onclick="loginUser()">
                →
            </button>

        </section>


        <!-- Main Buttons -->
        <section class="menu-grid">

            <!-- পরিচিতি -->
            <button class="menu-card identity" onclick="openPage('identity')">

                <div class="menu-icon">
                    🪪
                </div>

                <div class="menu-content">
                    <h3>পরিচিতি</h3>
                    <p>সদস্যের বিস্তারিত তথ্য দেখুন</p>
                </div>

                <span class="menu-arrow">→</span>

            </button>


            <!-- রক্তের আবেদন করুন -->
            <button class="menu-card blood-request" onclick="openPage('blood-request')">

                <div class="menu-icon">
                    🩸
                </div>

                <div class="menu-content">
                    <h3>রক্তের আবেদন করুন</h3>
                    <p>জরুরি রক্তের জন্য আবেদন করুন</p>
                </div>

                <span class="menu-arrow">→</span>

            </button>


            <!-- রক্তের আবেদনগুলি দেখুন -->
            <button class="menu-card blood-list" onclick="openPage('blood-list')">

                <div class="menu-icon">
                    📋
                </div>

                <div class="menu-content">
                    <h3>রক্তের আবেদনগুলি দেখুন</h3>
                    <p>সকল রক্তের আবেদন দেখুন</p>
                </div>

                <span class="menu-arrow">→</span>

            </button>


            <!-- সদস্য নিবন্ধন -->
            <button class="menu-card registration" onclick="openPage('registration')">

                <div class="menu-icon">
                    👤
                </div>

                <div class="menu-content">
                    <h3>সদস্য নিবন্ধন</h3>
                    <p>AABF-এর নতুন সদস্য হন</p>
                </div>

                <span class="menu-arrow">→</span>

            </button>


            <!-- ত্রাণ সহায়তা -->
            <button class="menu-card relief" onclick="openPage('relief')">

                <div class="menu-icon">
                    🤝
                </div>

                <div class="menu-content">
                    <h3>ত্রাণ সহায়তা</h3>
                    <p>সহায়তার জন্য আবেদন করুন</p>
                </div>

                <span class="menu-arrow">→</span>

            </button>

        </section>


        <!-- Emergency -->
        <button class="emergency-btn" onclick="emergencyCall()">

            <div class="emergency-icon">
                ☎
            </div>

            <div class="emergency-text">
                <h3>Emergency</h3>
                <p>জরুরি সহায়তা প্রয়োজন?</p>
            </div>

            <span class="emergency-arrow">
                →
            </span>

        </button>


        <!-- Footer -->
        <footer>
            Al-Awn Blood Fighters
            <span>•</span>
            AABF
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
