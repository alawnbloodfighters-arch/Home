<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>আল-আওন ব্লাড ফাইটার্স</title>

    <link rel="stylesheet" href="style.css">

    <!-- Bengali Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <main class="app">

        <!-- ================= HEADER ================= -->
        <header class="top-header">

            <div class="brand">

                <!-- Organization Logo -->
                <img
                    src="logo.png"
                    class="org-logo"
                    alt="AABF Logo"
                >

                <div class="brand-text">
                    <h1>আল-আওন ব্লাড ফাইটার্স</h1>
                    <p>AABF • Feni + Cumilla</p>
                </div>

            </div>

            <!-- Profile -->
            <button class="profile-btn" onclick="openProfile()">
                <div class="profile-circle">
                    <span class="profile-icon">♙</span>
                </div>
                <span>প্রোফাইল</span>
            </button>

        </header>


        <!-- ================= USER CARD ================= -->
        <section class="user-card">

            <div class="user-avatar">
                <span>●</span>
                <span class="avatar-body"></span>
            </div>

            <div class="user-info">
                <p class="welcome">স্বাগতম</p>

                <h2>ব্যবহারকারী</h2>

                <p class="member-id">
                    AABF ID :
                    <strong id="userAabfId">Login করুন</strong>
                </p>
            </div>

            <button class="user-arrow" onclick="login()">
                →
            </button>

        </section>


        <!-- ================= MAIN BUTTONS ================= -->
        <section class="menu-grid">

            <!-- পরিচিতি -->
            <button class="menu-card card-profile" onclick="openPage('profile')">

                <div class="icon-box">
                    <span class="icon">▣</span>
                </div>

                <div class="card-content">
                    <h3>পরিচিতি</h3>
                    <p>সদস্যের বিস্তারিত তথ্য দেখুন</p>
                </div>

                <span class="card-arrow">→</span>

            </button>


            <!-- রক্তের আবেদন করুন -->
            <button class="menu-card card-blood-request" onclick="openPage('blood-request')">

                <div class="icon-box">
                    <span class="blood-icon">♧</span>
                </div>

                <div class="card-content">
                    <h3>রক্তের আবেদন করুন</h3>
                    <p>জরুরি রক্তের জন্য আবেদন করুন</p>
                </div>

                <span class="card-arrow">→</span>

            </button>


            <!-- রক্তের আবেদনগুলি দেখুন -->
            <button class="menu-card card-blood-list" onclick="openPage('blood-list')">

                <div class="icon-box">
                    <span class="icon">▤</span>
                </div>

                <div class="card-content">
                    <h3>রক্তের আবেদনগুলি দেখুন</h3>
                    <p>সকল রক্তের আবেদন দেখুন</p>
                </div>

                <span class="card-arrow">→</span>

            </button>


            <!-- সদস্য নিবন্ধন -->
            <button class="menu-card card-register" onclick="openPage('register')">

                <div class="icon-box">
                    <span class="register-icon">♙+</span>
                </div>

                <div class="card-content">
                    <h3>সদস্য নিবন্ধন</h3>
                    <p>AABF-এর নতুন সদস্য হন</p>
                </div>

                <span class="card-arrow">→</span>

            </button>


            <!-- ত্রাণ সহায়তা -->
            <button class="menu-card card-relief" onclick="openPage('relief')">

                <div class="icon-box">
                    <span class="relief-icon">♢</span>
                </div>

                <div class="card-content">
                    <h3>ত্রাণ সহায়তা</h3>
                    <p>সহায়তার জন্য আবেদন করুন</p>
                </div>

                <span class="card-arrow">→</span>

            </button>

        </section>


        <!-- ================= EMERGENCY ================= -->
        <button class="emergency-btn" onclick="emergency()">

            <div class="emergency-icon">
                ☎
            </div>

            <div class="emergency-text">
                <h3>Emergency</h3>
                <p>জরুরি সহায়তা প্রয়োজন?</p>
            </div>

            <span class="emergency-arrow">
                →
            </span>

        </button>


        <!-- ================= FOOTER ================= -->
        <footer>
            <span>Al-Awn Blood Fighters</span>
            <b>•</b>
            <span>AABF</span>
        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
