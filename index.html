            font-size: 25px;

            font-weight: 700;

            line-height: 1.15;

            letter-spacing: -0.5px;

        }


        /* =========================
           UNREAD BADGES

        .card-blue {

            position: relative;

        .home-unread-badges {

            position: absolute;

            top: 7px;

            right: 7px;

            display: flex;

            flex-direction: column;

            align-items: flex-end;

            gap: 5px;

            z-index: 20;

            pointer-events: none;

        }


        .home-unread-badge {

            display: none;

            align-items: center;

            justify-content: center;

            min-width: 29px;

            height: 25px;

            padding: 0 7px;

            border-radius: 50px;

            color: #fff;

            font-family:
                Arial,
                "Noto Sans Bengali",
                sans-serif;

            font-size: 12px;

            font-weight: 800;

            line-height: 1;

            white-space: nowrap;

            box-shadow:
                0 2px 6px
                rgba(0,0,0,0.20);

            border: 2px solid #fff;

        }


        .home-blood-badge {

            background: #d00000;

        }


        .home-message-badge {

            background: #087f73;

        }

    </style>

</head>


<body>

    <section

        </button>



        <button
            class="action-card card-green"
            type="button"
            onclick="goTo('blood-request.html')"
        >

            <div class="card-icon">

            </div>


            <div class="card-content">

                <h3>

                    রক্তের<br>
                    আবেদন

                </h3>

            </div>


            <div class="card-arrow">

        </button>



        <button
            class="action-card card-blue"

            type="button"
            onclick="goTo('blood-requests.html')"
        >

            <div

            >

                <span
                    id="newRequestBadge"
                    class="home-unread-badge home-blood-badge"

                    🩸 0
                </span>


                <span

            <div class="card-icon">

        </span>

        <b>
            •
        </b>

            AABF
        </span>

    </footer>


</div>



<script
    type="module"
    src="script.js"
></script>



<script type="module">


// ==========================================
// FIREBASE
// ==========================================

import {

    auth,
    db

}
from "./firebase-config.js";


import {

    onAuthStateChanged

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {

    ref,
    onValue

}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



// ==========================================
// ELEMENTS
// ==========================================

const bloodRequestsButton =
    document.getElementById(
        "bloodRequestsButton"
    );


const newRequestBadge =
    document.getElementById(
        "newRequestBadge"
    );


const newMessageBadge =
    document.getElementById(
        "newMessageBadge"
    );



// ==========================================
// GLOBAL
// ==========================================

let currentUser = null;

let requestsData = {};

let publicChatsData = {};

let firebaseRequestsLoaded = false;

let firebaseChatsLoaded = false;



// ==========================================
// LOCAL STORAGE
// ==========================================

const REQUEST_SEEN_KEY =
    "aabf_home_request_seen_at";


const REQUEST_INITIALIZED_KEY =
    "aabf_home_request_initialized";



// ==========================================
// HIDE BADGE
// ==========================================

function hideBadge(badge) {

    if (!badge) {

        return;

    }


    badge.style.display =
        "none";

}



// ==========================================
// SHOW BADGE
// ==========================================

function showBadge(

    badge,

    emoji,

    count

) {

    if (!badge) {

        return;

    }


    const number =
        Number(count || 0);


    if (number <= 0) {

        hideBadge(badge);

        return;

    }


    badge.innerText =

        emoji +

        " " +

        (
            number > 99
            ?
            "99+"
            :
            String(number)
        );


    badge.style.display =
        "flex";

}



// ==========================================
// REQUEST COUNT
// ==========================================

function calculateNewRequestCount() {

    if (!firebaseRequestsLoaded) {

        return;

    }


    const allRequests =
        Object.values(
            requestsData || {}
        );


    /*
     * প্রথমবার এই browser-এ
     * system চালু হলে পুরনো request-কে
     * নতুন request হিসেবে দেখাবে না।
     */

    const initialized =
        localStorage.getItem(
            REQUEST_INITIALIZED_KEY
        );


    if (!initialized) {

        let latestTime = 0;


        allRequests.forEach(

            function(request) {

                if (!request) {

                    return;

                }


                const createdAt =
                    Number(
                        request.createdAt || 0
                    );


                if (
                    createdAt >
                    latestTime
                ) {

                    latestTime =
                        createdAt;

                }

            }

        );


        localStorage.setItem(

            REQUEST_SEEN_KEY,

            String(latestTime)

        );


        localStorage.setItem(

            REQUEST_INITIALIZED_KEY,

            "1"

        );


        hideBadge(
            newRequestBadge
        );

        return;

    }


    const seenAt =
        Number(
            localStorage.getItem(
                REQUEST_SEEN_KEY
            ) || 0
        );


    let newCount = 0;


    allRequests.forEach(

        function(request) {

            if (!request) {

                return;

            }


            const createdAt =
                Number(
                    request.createdAt || 0
                );


            if (

                createdAt > 0 &&

                createdAt > seenAt

            ) {

                newCount++;

            }

        }

    );


    showBadge(

        newRequestBadge,

        "🩸",

        newCount

    );

}



// ==========================================
// MESSAGE CARD COUNT
// ==========================================

function calculateUnreadMessageCards() {

    if (

        !firebaseChatsLoaded ||

        !currentUser

    ) {

        hideBadge(
            newMessageBadge
        );

        return;

    }


    let unreadCardCount = 0;


    Object.values(
        publicChatsData || {}
    ).forEach(

        function(chat) {

            if (!chat) {

                return;

            }


            const messages =
                chat.messages || {};


            const readState =
                chat.readState || {};


            const userReadState =

                readState[
                    currentUser.uid
                ] || {};


            const lastReadAt =
                Number(
                    userReadState.lastReadAt || 0
                );


            let cardHasUnread =
                false;


            Object.values(messages).forEach(

                function(message) {

                    if (!message) {

                        return;

                    }


                    const messageTime =
                        Number(
                            message.createdAt || 0
                        );


                    const senderUid =
                        String(
                            message.uid || ""
                        );


                    /*
                     * নিজের message কখনো unread হবে না।
                     */

                    if (

                        senderUid !==
                        String(
                            currentUser.uid
                        )

                        &&

                        messageTime >
                        lastReadAt

                    ) {

                        cardHasUnread =
                            true;

                    }

                }

            );


            /*
             * গুরুত্বপূর্ণ:
             *
             * এখানে message-এর সংখ্যা
             * count করা হচ্ছে না।
             *
             * একটি card-এ ১টা message থাকুক
             * অথবা ১০০টা message থাকুক,
             * unread থাকলে card count = ১।
             */

            if (cardHasUnread) {

                unreadCardCount++;

            }

        }

    );


    showBadge(

        newMessageBadge,

        "💬",

        unreadCardCount

    );

}



// ==========================================
// UPDATE ALL BADGES
// ==========================================

function updateAllBadges() {

    calculateNewRequestCount();

    calculateUnreadMessageCards();

}



// ==========================================
// LOAD BLOOD REQUESTS
// ==========================================

function listenBloodRequests() {

    const requestsRef =
        ref(
            db,
            "bloodRequests"
        );


    onValue(

        requestsRef,

        function(snapshot) {

            requestsData =
                snapshot.val() || {};


            firebaseRequestsLoaded =
                true;


            updateAllBadges();

        },

        function(error) {

            console.error(
                "Blood Request Badge Error:",
                error
            );

        }

    );

}



// ==========================================
// LOAD PUBLIC CHATS
// ==========================================

function listenPublicChats() {

    const publicChatsRef =
        ref(
            db,
            "publicChats"
        );


    onValue(

        publicChatsRef,

        function(snapshot) {

            publicChatsData =
                snapshot.val() || {};


            firebaseChatsLoaded =
                true;


            updateAllBadges();

        },

        function(error) {

            console.error(
                "Public Chat Badge Error:",
                error
            );

        }

    );

}



// ==========================================
// AUTH
// ==========================================

onAuthStateChanged(

    auth,

    function(user) {

        currentUser =
            user;


        updateAllBadges();

    }

);



// ==========================================
// PAGE SHOW
// ==========================================

window.addEventListener(

    "pageshow",

    function() {

        setTimeout(

            function() {

                updateAllBadges();

            },

            200

        );

    }

);



// ==========================================
// TAB / APP VISIBLE
// ==========================================

document.addEventListener(

    "visibilitychange",

    function() {

        if (

            document.visibilityState ===
            "visible"

        ) {

            setTimeout(

                function() {

                    updateAllBadges();

                },

                200

            );

        }

    }

);



// ==========================================
// REQUEST BUTTON
// ==========================================

if (bloodRequestsButton) {

    bloodRequestsButton.addEventListener(

        "click",

        function() {

            /*
             * বর্তমান request list-এর
             * সবচেয়ে নতুন createdAt বের করি।
             */

            let latestRequestTime =
                Number(
                    localStorage.getItem(
                        REQUEST_SEEN_KEY
                    ) || 0
                );


            Object.values(
                requestsData || {}
            ).forEach(

                function(request) {

                    if (!request) {

                        return;

                    }


                    const createdAt =
                        Number(
                            request.createdAt || 0
                        );


                    if (

                        createdAt >
                        latestRequestTime

                    ) {

                        latestRequestTime =
                            createdAt;

                    }

                }

            );


            /*
             * আবেদন দেখুন চাপার সাথে
             * নতুন requestগুলো seen হবে।
             */

            localStorage.setItem(

                REQUEST_SEEN_KEY,

                String(
                    latestRequestTime
                )

            );


            hideBadge(
                newRequestBadge
            );

        }

    );

}



// ==========================================
// START
// ==========================================

listenBloodRequests();

listenPublicChats();

</script>


</body>

</html>
