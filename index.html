<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>আল-আওন ব্লাড ফাইটার্স</title>

  <link rel="stylesheet" href="style.css">

  <!-- বাংলা ফন্ট -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

  <div class="app">

    <!-- HEADER -->
    <header class="top-header">

      <div class="brand">

        <div class="logo-box">
          <img src="logo.png" alt="AABF Logo">
        </div>

        <div class="brand-text">
          <h1>আল-আওন ব্লাড ফাইটার্স</h1>
          <p>AABF • Feni + Cumilla</p>
        </div>

      </div>

      <button class="profile-btn" onclick="openProfile()">
        <i class="fa-regular fa-user"></i>
        <span>প্রোফাইল</span>
      </button>

    </header>


    <!-- USER CARD -->
    <section class="user-card" onclick="login()">

      <div class="user-icon">
        <i class="fa-solid fa-user"></i>
      </div>

      <div class="user-info">
        <span>স্বাগতম</span>
        <h2>ব্যবহারকারী</h2>
        <p>AABF ID : <b>Login করুন</b></p>
      </div>

      <div class="round-arrow">
        <i class="fa-solid fa-arrow-right"></i>
      </div>

    </section>


    <!-- MAIN BUTTONS -->
    <main class="button-grid">

      <!-- পরিচিতি -->
      <button class="action-card card-pink" onclick="goTo('porichiti.html')">

        <div class="card-icon">
          <i class="fa-regular fa-address-card"></i>
        </div>

        <div class="card-content">
          <h3>পরিচিতি</h3>
          <p>সদস্যের বিস্তারিত তথ্য দেখুন</p>
        </div>

        <div class="card-arrow">
          <i class="fa-solid fa-arrow-right"></i>
        </div>

      </button>


      <!-- রক্তের আবেদন করুন -->
      <button class="action-card card-green" onclick="goTo('blood-request.html')">

        <div class="card-icon">
          <i class="fa-solid fa-droplet"></i>
        </div>

        <div class="card-content">
          <h3>রক্তের আবেদন করুন</h3>
          <p>জরুরি রক্তের জন্য আবেদন করুন</p>
        </div>

        <div class="card-arrow">
          <i class="fa-solid fa-arrow-right"></i>
        </div>

      </button>


      <!-- রক্তের আবেদনগুলি দেখুন -->
      <button class="action-card card-blue" onclick="goTo('blood-requests.html')">

        <div class="card-icon">
          <i class="fa-solid fa-file-medical"></i>
        </div>

        <div class="card-content">
          <h3>রক্তের আবেদনগুলি দেখুন</h3>
          <p>সকল রক্তের আবেদন দেখুন</p>
        </div>

        <div class="card-arrow">
          <i class="fa-solid fa-arrow-right"></i>
        </div>

      </button>


      <!-- সদস্য নিবন্ধন -->
      <button class="action-card card-purple" onclick="goTo('registration.html')">

        <div class="card-icon">
          <i class="fa-solid fa-user-plus"></i>
        </div>

        <div class="card-content">
          <h3>সদস্য নিবন্ধন</h3>
          <p>AABF-এর নতুন সদস্য হন</p>
        </div>

        <div class="card-arrow">
          <i class="fa-solid fa-arrow-right"></i>
        </div>

      </button>

    </main>


    <!-- ত্রাণ সহায়তা -->
    <button class="relief-card" onclick="goTo('relief.html')">

      <div class="relief-icon">
        <i class="fa-solid fa-hands-holding-child"></i>
      </div>

      <div class="relief-content">
        <h3>ত্রাণ সহায়তা</h3>
        <p>সহায়তার জন্য আবেদন করুন</p>
      </div>

      <div class="relief-arrow">
        <i class="fa-solid fa-arrow-right"></i>
      </div>

    </button>


    <!-- EMERGENCY -->
    <button class="emergency-btn" onclick="emergency()">

      <div class="emergency-icon">
        <i class="fa-solid fa-phone"></i>
      </div>

      <div class="emergency-text">
        <h3>Emergency</h3>
        <p>জরুরি সহায়তা প্রয়োজন?</p>
      </div>

      <div class="emergency-arrow">
        <i class="fa-solid fa-arrow-right"></i>
      </div>

    </button>


    <!-- FOOTER -->
    <footer>
      <span>Al-Awn Blood Fighters</span>
      <b>•</b>
      <span>AABF</span>
    </footer>

  </div>

  <script src="script.js"></script>

</body>
</html>
