<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>আল-আওন ব্লাড ফাইটার্স</title>

    <link rel="stylesheet" href="style.css">


    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >


    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        .action-card .card-content h3 {

            font-size: 25px;

            font-weight: 700;

            line-height: 1.15;

            margin: 0;

            letter-spacing: -0.5px;

        }

    </style>

</head>


<body>


<div class="app">


    <header class="top-header">

        <div class="brand">

            <div class="logo-box">

                <img
                    src="logo.png"
                    alt="Al-Awn Blood Fighters Logo"
                >

            </div>


            <div class="brand-text">

                <h1>

                    আল-আওন ব্লাড<br>
                    ফাইটার্স

                </h1>


                <p>

                    AABF • Feni + Cumilla

                </p>

            </div>

        </div>

    </header>



    <!-- USER / PROFILE -->

    <section
        class="user-card"
        id="userCard"
        onclick="login()"
    >

        <div class="user-icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <div class="user-info">

            <span class="welcome">

                স্বাগতম

            </span>


            <h2 id="userName">

                ব্যবহারকারী

            </h2>


            <p>

                AABF ID :

                <b id="userAABFID">
                    Login করুন
                </b>

            </p>

        </div>


        <div class="user-arrow">

            <i class="fa-solid fa-arrow-right"></i>

        </div>

    </section>



    <main class="button-grid">


        <button
            class="action-card card-pink"
            type="button"
            onclick="goTo('porichiti.html')"
        >

            <div class="card-icon">

                <i class="fa-regular fa-address-card"></i>

            </div>


            <div class="card-content">

                <h3>
                    পরিচিতি
                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>



        <button
            class="action-card card-green"
            type="button"
            onclick="goTo('blood-request.html')"
        >

            <div class="card-icon">

                <i class="fa-solid fa-droplet"></i>

            </div>


            <div class="card-content">

                <h3>

                    রক্তের<br>
                    আবেদন

                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>



        <button
            class="action-card card-blue"
            type="button"
            onclick="goTo('blood-requests.html')"
        >

            <div class="card-icon">

                <i class="fa-solid fa-file-medical"></i>

            </div>


            <div class="card-content">

                <h3>

                    আবেদন<br>
                    দেখুন

                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>



        <button
            class="action-card card-purple"
            type="button"
            onclick="goTo('registration.html')"
        >

            <div class="card-icon">

                <i class="fa-solid fa-user-plus"></i>

            </div>


            <div class="card-content">

                <h3>

                    সদস্য<br>
                    নিবন্ধন

                </h3>

            </div>


            <div class="card-arrow">

                <i class="fa-solid fa-arrow-right"></i>

            </div>

        </button>


    </main>



    <button
        class="relief-card"
        type="button"
        onclick="window.location.href='https://alawnbloodfighters-arch.github.io/Home/donation.html'"
    >

        <div class="relief-icon">

            <i class="fa-solid fa-hands-holding-child"></i>

        </div>


        <div class="relief-content">

            <h3>
                ত্রাণ সহায়তা
            </h3>


            <p>
                সংগঠনকে অর্থ সাহায্য করুন
            </p>

        </div>


        <div class="relief-arrow">

            <i class="fa-solid fa-arrow-right"></i>

        </div>

    </button>



    <button
        class="emergency-btn"
        type="button"
        onclick="emergency()"
    >

        <div class="emergency-icon">

            <i class="fa-solid fa-phone"></i>

        </div>


        <div class="emergency-text">

            <h3>
                Emergency
            </h3>


            <p>
                জরুরি সহায়তা প্রয়োজন?
            </p>

        </div>


        <div class="emergency-arrow">

            <i class="fa-solid fa-arrow-right"></i>

        </div>

    </button>



    <footer class="footer">

        <span>
            Al-Awn Blood Fighters
        </span>

        <b>
            •
        </b>

        <span>
            AABF
        </span>

    </footer>


</div>


<!-- IMPORTANT:
     Home script must be module because
     Firebase SDK is imported inside it.
-->

<script
    type="module"
    src="script.js"
></script>


</body>

</html>
