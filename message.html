.empty {

    font-size: 14px;

.error {
    text-align: center;

    margin: 60px 20px 0;

    font-size: 14px;

    line-height: 1.6;
}

.input-area {

    right: 0;
    bottom: 0;

    height: 68px;

    background: white;

    padding: 9px 10px;

    gap: 8px;

    border-top: 1px solid #ddd;

#messageInput {
    flex: 1;
    min-width: 0;

    height: 48px;

    border: 1px solid #ddd;

    border-radius: 25px;

    padding: 0 15px;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    font-size: 16px;

    outline: none;

    -webkit-appearance: none;
}

#messageInput:focus {
    border-color: #086b61;
}

#sendBtn {
    flex: 0 0 112px;

    height: 48px;

    border: none;

    border-radius: 25px;

    background: #086b61;

    color: white;

    font-size: 15px;
    font-weight: bold;

    padding: 0;

    cursor: pointer;

    -webkit-appearance: none;
}

#sendBtn:active {
    transform: scale(.97);
}

#sendBtn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

@media (max-width: 360px) {

    .header {
        height: 54px;
        font-size: 19px;
    }

    .chat {
        top: 54px;
        bottom: 64px;
        padding: 10px 8px;
    }

    .input-area {
        height: 64px;
        padding: 8px;
    }

    #messageInput {
        height: 44px;
        font-size: 15px;
    }

    #sendBtn {
        flex-basis: 100px;
        height: 44px;
        font-size: 14px;
    }

    .message {
        font-size: 15px;
    }
}

@media (max-width: 320px) {

    .header {
        font-size: 17px;
    }

    #sendBtn {
        flex-basis: 88px;
        font-size: 13px;
    }

    .message {
        max-width: 84%;
    }
}

</style>
