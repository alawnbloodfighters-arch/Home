<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Message AABF Team</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .message-container {
            max-width: 500px;
            min-height: 100vh;
            margin: auto;
            padding: 25px 18px;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        .logo {
            width: 70px;
            height: 70px;
            margin: auto;
            border-radius: 50%;
            background: #d62828;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.12);
        }

        .header h1 {
            margin: 15px 0 5px;
            font-size: 25px;
        }

        .header p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        .message-card {
            background: white;
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            resize: vertical;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 14px;
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        textarea:focus {
            border-color: #d62828;
            box-shadow: 0 0 0 3px rgba(214, 40, 40, 0.08);
        }

        .char-count {
            text-align: right;
            margin-top: 6px;
            color: #888;
            font-size: 12px;
        }

        .send-btn {
            width: 100%;
            margin-top: 18px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #d62828;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .back-btn {
            width: 100%;
            margin-top: 12px;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
            color: #333;
            font-size: 15px;
            cursor: pointer;
        }

        .status {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
        }

        .status.success {
            display: block;
            background: #e8f7ed;
            color: #16803c;
        }

        .status.error {
            display: block;
            background: #fdecec;
            color: #c62828;
        }
    </style>
</head>

<body>

    <div class="message-container">

        <div class="header">
            <div class="logo">♥</div>

            <h1>Message AABF Team</h1>

            <p>আপনার বার্তা আমাদের কাছে পাঠান</p>
        </div>

        <div class="message-card">

            <label class="label" for="message">
                আপনার Message
            </label>

            <textarea
                id="message"
                maxlength="1000"
                placeholder="আপনার কথা এখানে লিখুন..."
            ></textarea>

            <div class="char-count">
                <span id="charCount">0</span>/1000
            </div>

            <button class="send-btn" onclick="sendMessage()">
                Send Message
            </button>

            <button class="back-btn" onclick="goBack()">
                ← Back
            </button>

            <div id="status" class="status"></div>

        </div>

    </div>


    <script>

        const messageBox = document.getElementById("message");
        const charCount = document.getElementById("charCount");
        const statusBox = document.getElementById("status");


        // Character counter
        messageBox.addEventListener("input", function () {

            charCount.textContent = this.value.length;

        });


        // Send message
        function sendMessage() {

            const message = messageBox.value.trim();

            if (message.length === 0) {

                showStatus(
                    "দয়া করে একটি message লিখুন।",
                    "error"
                );

                return;
            }

            /*
             * Firebase code এখানে পরে যোগ করা হবে।
             *
             * এখন শুধু UI প্রস্তুত করা হয়েছে।
             */

            showStatus(
                "Message প্রস্তুত আছে। Firebase connection পরের ধাপে যোগ হবে।",
                "success"
            );

        }


        // Back
        function goBack() {

            if (window.history.length > 1) {

                window.history.back();

            } else {

                alert("Back button চাপা হয়েছে।");

            }

        }


        // Status message
        function showStatus(message, type) {

            statusBox.textContent = message;

            statusBox.className = "status " + type;

        }

    </script>

</body>
</html>
