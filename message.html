<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               minimum-scale=1.0,
               user-scalable=no">

<meta name="HandheldFriendly" content="true">

<title>কর্তৃপক্ষকে মেসেজ দিন</title>


<style>

/* ==============================
   MOBILE / MIT APP VIEW
   ============================== */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html {
    width: 100%;
    height: 100%;
    overflow: hidden;

    touch-action: manipulation;
}

body {

    width: 100%;
    height: 100%;

    margin: 0;
    padding: 0;

    overflow: hidden;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    background: #eeeae2;

    /* Browser zoom বন্ধ */
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* ==============================
   HEADER
   ============================== */

.header {

    width: 100%;

    height: 58px;

    background: #086b61;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 0 10px;

    font-size: 21px;

    font-weight: bold;

    white-space: nowrap;

}


/* ==============================
   CHAT AREA
   ============================== */

.chat {

    position: absolute;

    top: 58px;

    left: 0;

    right: 0;

    bottom: 68px;

    overflow-y: auto;

    overflow-x: hidden;

    padding: 12px 10px 15px;

    -webkit-overflow-scrolling: touch;
}


/* ==============================
   MESSAGE
   ============================== */

.message {

    max-width: 78%;

    padding: 9px 13px;

    margin-bottom: 9px;

    border-radius: 13px;

    font-size: 16px;

    line-height: 1.45;

    word-break: break-word;

}


/* ADMIN */

.admin {

    background: white;

    margin-right: auto;

    border-top-left-radius: 4px;

}


/* USER */

.user {

    background: #d7ffc9;

    margin-left: auto;

    border-top-right-radius: 4px;

}


/* TIME */

.time {

    display: block;

    margin-top: 3px;

    font-size: 10px;

    color: #777;

    text-align: right;
}


/* ==============================
   EMPTY MESSAGE
   ============================== */

.empty {

    text-align: center;

    color: #888;

    margin-top: 60px;

    font-size: 14px;
}


/* ==============================
   BOTTOM INPUT
   ============================== */

.input-area {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 68px;

    background: white;

    padding: 9px 10px;

    display: flex;

    align-items: center;

    gap: 8px;

    border-top: 1px solid #ddd;

}


/* INPUT */

#messageInput {

    flex: 1;

    min-width: 0;

    height: 48px;

    border: 1px solid #ddd;

    border-radius: 25px;

    padding: 0 15px;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    font-size: 16px;

    outline: none;

    -webkit-appearance: none;

    /* zoom আটকাতে */
    transform: scale(1);

}


#messageInput:focus {

    border-color: #086b61;

}


/* SEND BUTTON */

#sendBtn {

    flex: 0 0 112px;

    height: 48px;

    border: none;

    border-radius: 25px;

    background: #086b61;

    color: white;

    font-size: 15px;

    font-weight: bold;

    padding: 0;

    cursor: pointer;

    -webkit-appearance: none;

}


#sendBtn:active {

    transform: scale(.97);

}


/* ==============================
   SMALL PHONE
   ============================== */

@media (max-width: 360px) {

    .header {

        height: 54px;

        font-size: 19px;

    }

    .chat {

        top: 54px;

        bottom: 64px;

        padding: 10px 8px;

    }

    .input-area {

        height: 64px;

        padding: 8px;

    }

    #messageInput {

        height: 44px;

        font-size: 15px;

    }

    #sendBtn {

        flex-basis: 100px;

        height: 44px;

        font-size: 14px;

    }

    .message {

        font-size: 15px;

    }

}


/* ==============================
   EXTRA SMALL PHONE
   ============================== */

@media (max-width: 320px) {

    .header {

        font-size: 17px;

    }

    #sendBtn {

        flex-basis: 88px;

        font-size: 13px;

    }

    .message {

        max-width: 84%;

    }

}

</style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    কর্তৃপক্ষকে মেসেজ দিন

</div>



<!-- CHAT -->

<div id="chat" class="chat">

    <div class="empty">

        আপনার মেসেজ এখানে দেখা যাবে

    </div>

</div>



<!-- INPUT -->

<div class="input-area">

    <input
        type="text"
        id="messageInput"
        placeholder="মেসেজ লিখুন"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="sentences"
        spellcheck="false"
    >

    <button id="sendBtn">

        Send

    </button>

</div>



<script>

/* ==============================
   DEMO CHAT
   Firebase পরে বসাবো
   ============================== */

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");


function sendMessage() {

    const text =
        input.value.trim();


    if (!text) {

        return;

    }


    /* প্রথম message হলে empty সরাবে */

    const empty =
        chat.querySelector(".empty");

    if (empty) {

        empty.remove();

    }


    /* Message তৈরি */

    const message =
        document.createElement("div");

    message.className =
        "message user";

    message.textContent =
        text;


    /* Time */

    const time =
        document.createElement("span");

    time.className =
        "time";

    const now =
        new Date();

    time.textContent =
        now.getHours()
        + ":"
        +
        String(
            now.getMinutes()
        ).padStart(2, "0");


    message.appendChild(time);

    chat.appendChild(message);


    /* নিচে নিয়ে যাবে */

    chat.scrollTop =
        chat.scrollHeight;


    input.value = "";

    input.focus();

}


/* Send */

sendBtn.addEventListener(
    "click",
    sendMessage
);


/* Enter */

input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);

</script>


</body>

</html>
