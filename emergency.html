<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <meta
        name="theme-color"
        content="#e00000"
    >

    <title>ইমার্জেন্সি যোগাযোগ</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
            font-family:
                "Noto Sans Bengali",
                "Arial",
                sans-serif;
        }


        body {
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        .page {
            width: 100%;
            max-width: 720px;
            height: 100dvh;
            overflow: hidden;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;
            height: 78px;
            min-height: 78px;
            background: linear-gradient(
                135deg,
                #d90000,
                #f00000
            );

            color: white;

            display: flex;
            align-items: center;

            position: relative;

            padding: 0 18px;
        }


        .back {
            width: 50px;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;
            text-decoration: none;

            font-size: 42px;
            font-weight: 400;

            flex-shrink: 0;
        }


        .header-title {
            flex: 1;

            text-align: center;

            font-size: clamp(
                27px,
                6vw,
                40px
            );

            font-weight: 800;

            white-space: nowrap;
        }



        /* =========================
           MAIN
        ========================= */

        .content {
            flex: 1;

            display: flex;
            flex-direction: column;

            justify-content: space-evenly;

            padding:
                10px
                20px
                12px;

            overflow: hidden;
        }



        /* =========================
           SECTION TITLE
        ========================= */

        .section-title {
            display: flex;
            align-items: center;

            gap: 10px;

            font-size: clamp(
                22px,
                5.3vw,
                34px
            );

            font-weight: 800;

            color: #111;

            white-space: nowrap;

            margin-bottom: 4px;
        }


        .section-icon {
            font-size: clamp(
                28px,
                6vw,
                40px
            );

            flex-shrink: 0;
        }


        .line {
            height: 4px;

            background: #c90000;

            flex: 1;

            border-radius: 10px;

            position: relative;
        }


        .line::after {
            content: "";

            position: absolute;

            right: 0;
            top: 50%;

            transform:
                translateY(-50%);

            width: 12px;
            height: 12px;

            background: #c90000;

            border-radius: 50%;
        }



        /* =========================
           CONTACT GRID
        ========================= */

        .contact-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;

            width: 100%;
        }


        .contact-card {
            background: #ffffff;

            border-radius: 18px;

            box-shadow:
                0 4px 14px
                rgba(0, 0, 0, 0.13);

            padding: 10px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: space-between;

            min-width: 0;

            overflow: hidden;
        }



        /* =========================
           PROFILE IMAGE
        ========================= */

        .profile-image {
            width: clamp(
                88px,
                19vw,
                125px
            );

            height: clamp(
                88px,
                19vw,
                125px
            );

            border-radius: 50%;

            object-fit: cover;

            border: 3px solid #c80000;

            margin: 2px 0 8px;
        }



        /* =========================
           CALL BUTTON
        ========================= */

        .call-button {
            width: 100%;

            min-height: 58px;

            border-radius: 15px;

            background:
                linear-gradient(
                    135deg,
                    #e00000,
                    #ff0808
                );

            color: white;

            text-decoration: none;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            text-align: center;

            font-size: clamp(
                18px,
                4.5vw,
                28px
            );

            font-weight: 800;

            line-height: 1.15;

            padding: 8px 5px;

            border: none;

            cursor: pointer;

            user-select: none;

            transition:
                transform 0.1s ease,
                opacity 0.1s ease;
        }


        .call-button:active {
            transform: scale(0.97);
            opacity: 0.85;
        }


        .phone-icon {
            font-size: clamp(
                25px,
                6vw,
                38px
            );

            flex-shrink: 0;
        }



        /* =========================
           MESSAGE AREA
        ========================= */

        .message-title {
            display: flex;

            align-items: center;

            gap: 10px;

            font-size: clamp(
                22px,
                5.3vw,
                34px
            );

            font-weight: 800;

            white-space: nowrap;
        }


        .message-icon {
            font-size: clamp(
                28px,
                6vw,
                40px
            );
        }


        .message-grid {
            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 12px;
        }


        .message-button {
            height: 58px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            text-decoration: none;

            color: white;

            font-size: clamp(
                16px,
                4vw,
                24px
            );

            font-weight: 800;

            text-align: center;

            line-height: 1.1;

            padding: 6px;

            user-select: none;
        }


        .facebook {
            background: #2867c7;
        }


        .team-message {
            background: #19a843;
        }


        .message-button:active {
            opacity: 0.8;
            transform: scale(0.97);
        }



        /* =========================
           SMALL SCREEN
        ========================= */

        @media (max-height: 700px) {

            .header {
                height: 64px;
                min-height: 64px;
            }


            .back {
                width: 42px;
                height: 42px;
                font-size: 34px;
            }


            .content {
                padding:
                    6px
                    16px
                    8px;
            }


            .profile-image {
                width: 78px;
                height: 78px;

                margin-bottom: 5px;
            }


            .call-button {
                min-height: 48px;

                font-size: 17px;

                border-radius: 12px;
            }


            .message-button {
                height: 48px;

                font-size: 15px;

                border-radius: 12px;
            }


            .contact-grid,
            .message-grid {
                gap: 8px;
            }

        }



        /* =========================
           VERY SMALL WIDTH
        ========================= */

        @media (max-width: 380px) {

            .content {
                padding-left: 12px;
                padding-right: 12px;
            }


            .contact-grid,
            .message-grid {
                gap: 7px;
            }


            .call-button {
                font-size: 16px;
            }


            .message-button {
                font-size: 14px;
            }

        }

    </style>

</head>



<body>


<div class="page">


    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <a
            href="index.html"
            class="back"
            aria-label="Back"
        >
            ←
        </a>


        <div class="header-title">
            ইমার্জেন্সি যোগাযোগ
        </div>

    </header>



    <!-- =========================
         CONTENT
    ========================== -->

    <main class="content">


        <!-- =====================
             ORGANIZATION
        ====================== -->

        <div class="section-title">

            <span class="section-icon">
                👥
            </span>

            <span>

            <span class="line"></span>

        </div>



        <div class="contact-grid">

            <div class="contact-card">

                <img
                    src="rifat.png"
                    class="profile-image"
                    alt="রিফাত"
                >


                <a
                    href="tel:+8801859259020"
                    class="call-button"
                    aria-label="Call রিফাত"
                >

                    <span class="phone-icon">
                        ☎
                    </span>

                    <span>
                        Call রিফাত
                    </span>

                </a>

            </div>



            <!-- মাঞ্জুরুল -->

            <div class="contact-card">

                <img
                    src="manjurul.png"
                    class="profile-image"
                    alt="মাঞ্জুরুল"
                >


                <a
                    href="tel:+8801618848777"
                    class="call-button"
                    aria-label="Call মাঞ্জুরুল"
                >

                    <span class="phone-icon">
                        ☎
                    </span>

                    <span>
                        Call মাঞ্জুরুল
                    </span>

                </a>

            </div>

        </div>



        <!-- =====================
             BLOOD
        ====================== -->

        <div class="section-title">

            <span class="section-icon">
                🩸
            </span>

            <span>
                জরুরী রক্তের প্রয়োজনে :
            </span>

            <span class="line"></span>

        </div>



        <div class="contact-grid">


            <!-- সোহাগ -->

            <div class="contact-card">

                <img
                    src="sohag.png"
                    class="profile-image"
                    alt="সোহাগ"
                >


                <a
                    href="tel:+8801812646476"
                    class="call-button"
                    aria-label="Call সোহাগ"
                >

                    <span class="phone-icon">
                        ☎
                    </span>

                    <span>
                        Call সোহাগ
                    </span>

                </a>

            </div>



            <!-- সাঈদ -->

            <div class="contact-card">

                <img
                    src="sayed.png"
                    class="profile-image"
                    alt="সাঈদ"
                >


                <a
                    href="tel:+8801897901243"
                    class="call-button"
                    aria-label="Call সাঈদ"
                >

                    <span class="phone-icon">
                        ☎
                    </span>

                    <span>
                        Call সাঈদ
                    </span>

                </a>

            </div>

        </div>



        <!-- =====================
             MESSAGE
        ====================== -->

        <div class="message-title">

            <span class="message-icon">
                💬
            </span>

            <span>
                মেসেজ পাঠান :
            </span>

            <span class="line"></span>

        </div>



        <div class="message-grid">


            <!-- FACEBOOK -->

            <a
                href="https://www.facebook.com/alawnbloodfighters"
                class="message-button facebook"
                aria-label="Open Facebook page"
            >

                <span>
                    f&nbsp;&nbsp; Open Facebook Page
                </span>

            </a>



            <!-- MESSAGE - LATER -->

            <a
                href="javascript:void(0)"
                class="message-button team-message"
                aria-label="Message AABF Team"
            >

                <span>
                    💬&nbsp; Message AABF Team
                </span>

            </a>

        </div>


    </main>

</div>



<script>

    /*
     * Disable long press context menu
     * for a cleaner mobile-app experience.
     */

    document.addEventListener(
        "contextmenu",
        function(event) {
            event.preventDefault();
        }
    );


    /*
     * Prevent accidental double-tap zoom.
     */

    let lastTouchEnd = 0;

    document.addEventListener(
        "touchend",
        function(event) {

            const now =
                Date.now();

            if (
                now - lastTouchEnd <= 300
            ) {

                event.preventDefault();

            }

            lastTouchEnd = now;

        },
        {
            passive: false
        }
    );

</script>


</body>

</html>
