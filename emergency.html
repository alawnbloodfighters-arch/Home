<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>ইমারজেন্সি যোগাযোগ</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;

    background: #ffffff;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow-x: hidden;
    overflow-y: hidden;

    touch-action: manipulation;
}

.container {
    width: 100%;
    max-width: 620px;
    margin: auto;
    padding-bottom: 12px;
}

.header {

    width: 100%;
    height: 68px;

    background: #e60000;

    display: flex;
    align-items: center;

    padding: 0 12px;

    color: white;
}

.back {

    width: 42px;

    font-size: 30px;
    font-weight: bold;

    cursor: pointer;

    flex-shrink: 0;
}

.header-title {

    flex: 1;

    text-align: center;

    font-size: 25px;

    font-weight: bold;

    white-space: nowrap;
}

.section {

    margin-top: 14px;

    padding: 0 16px;
}

.section-title {

    font-size: 21px;

    font-weight: bold;

    color: #111;

    margin-bottom: 10px;
}

.grid {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    padding: 0 16px;
}

.card {

    background: #ffffff;

    border-radius: 17px;

    padding: 10px 7px 8px;

    text-align: center;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.12);

    min-width: 0;
}

.profile-img {

    width: 105px;
    height: 105px;

    max-width: 75%;

    object-fit: cover;

    border-radius: 50%;

    border: 3px solid #c40000;

    display: block;

    margin: 0 auto 9px;
}

.call-button {

    width: 100%;

    min-height: 57px;

    border: none;

    border-radius: 14px;

    background: #ed0000;

    color: white;

    font-size: 20px;

    font-weight: bold;

    line-height: 1.1;

    padding: 7px 5px;

    cursor: pointer;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;
}

.call-button:active {

    transform: scale(0.97);
}

.phone-icon {

    font-size: 25px;

    flex-shrink: 0;
}

.message-section {

    margin-top: 17px;

    padding: 0 16px;
}

.message-title {

    font-size: 21px;

    font-weight: bold;

    color: #111;

    margin-bottom: 10px;
}

.message-grid {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;

    padding: 0 16px;
}

.facebook-button,
.message-button {

    min-height: 52px;

    border: none;

    border-radius: 13px;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    padding: 8px 5px;

    font-family: Arial, sans-serif;
}

.facebook-button {

    background: #2874c6;
}

.message-button {

    background: #16a63a;
}

.facebook-button:active,
.message-button:active {

    transform: scale(0.97);
}

@media (max-width: 400px) {

    .header {

        height: 64px;

        padding: 0 9px;
    }

    .back {

        width: 38px;

        font-size: 27px;
    }

    .header-title {

        font-size: 22px;
    }

    .section {

        margin-top: 12px;

        padding: 0 13px;
    }

    .section-title {

        font-size: 19px;

        margin-bottom: 8px;
    }

    .grid {

        gap: 10px;

        padding: 0 13px;
    }

    .card {

        border-radius: 15px;

        padding: 8px 6px 7px;
    }

    .profile-img {

        width: 92px;
        height: 92px;

        margin-bottom: 7px;
    }

    .call-button {

        min-height: 52px;

        font-size: 18px;

        border-radius: 12px;

        gap: 5px;
    }

    .phone-icon {

        font-size: 22px;
    }

    .message-section {

        margin-top: 14px;

        padding: 0 13px;
    }

    .message-title {

        font-size: 19px;

        margin-bottom: 8px;
    }

    .message-grid {

        gap: 10px;

        padding: 0 13px;
    }

    .facebook-button,
    .message-button {

        min-height: 48px;

        font-size: 14px;

        border-radius: 11px;
    }

}

</style>

</head>


<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <div
            class="back"
            onclick="goBack()">

            ←

        </div>

        <div class="header-title">

            ইমারজেন্সি যোগাযোগ

        </div>

    </div>


    <!-- ORGANIZATIONAL -->

    <div class="section">

        <div class="section-title">

            👥 সাংগঠনিক কার্যক্রম

        </div>

    </div>


    <div class="grid">

        <!-- রিফাত -->

        <div class="card">

            <img
                src="rifat.png"
                class="profile-img"
                alt="রিফাত">

            <button
                class="call-button"
                onclick="sendCommand('CALL_RIFAT')">

                <span class="phone-icon">
                    ☎
                </span>

                <span>
                    Call রিফাত
                </span>

            </button>

        </div>


        <!-- মাঞ্জুরুল -->

        <div class="card">

            <img
                src="manjurul.png"
                class="profile-img"
                alt="মাঞ্জুরুল">

            <button
                class="call-button"
                onclick="sendCommand('CALL_MANJURUL')">

                <span class="phone-icon">
                    ☎
                </span>

                <span>
                    Call মাঞ্জুরুল
                </span>

            </button>

        </div>

    </div>


    <!-- BLOOD -->

    <div class="section">

        <div class="section-title">

            🩸 জরুরী রক্তের প্রয়োজনে

        </div>

    </div>


    <div class="grid">

        <!-- সোহাগ -->

        <div class="card">

            <img
                src="sohag.png"
                class="profile-img"
                alt="সোহাগ">

            <button
                class="call-button"
                onclick="sendCommand('CALL_SOHAG')">

                <span class="phone-icon">
                    ☎
                </span>

                <span>
                    Call সোহাগ
                </span>

            </button>

        </div>


        <!-- সাঈদ -->

        <div class="card">

            <img
                src="sayed.png"
                class="profile-img"
                alt="সাঈদ">

            <button
                class="call-button"
                onclick="sendCommand('CALL_SAYED')">

                <span class="phone-icon">
                    ☎
                </span>

                <span>
                    Call সাঈদ
                </span>

            </button>

        </div>

    </div>


    <!-- MESSAGE -->

    <div class="message-section">

        <div class="message-title">

            💬 মেসেজ পাঠান

        </div>

    </div>


    <div class="message-grid">

        <!-- FACEBOOK -->

        <button
            class="facebook-button"
            onclick="sendCommand('OPEN_FACEBOOK')">

            Open Facebook Page

        </button>


        <!-- MESSAGE AABF -->

        <button
            class="message-button"
            onclick="window.location.href='https://alawnbloodfighters-arch.github.io/Home/message.html'">

            💬 Message AABF Team

        </button>

    </div>

</div>


<script>


/* ============================= */
/* SEND COMMAND TO MIT APP */
/* ============================= */

function sendCommand(command) {

    if (
        window.AppInventor &&
        window.AppInventor.setWebViewString
    ) {

        window.AppInventor.setWebViewString(command);

        return;

    }


    /*
     * Browser-এ পরীক্ষা করলে
     * command দেখাবে।
     */

    console.log("App Inventor Command:", command);

}


/* ============================= */
/* BACK */
/* ============================= */

function goBack() {

    if (
        window.AppInventor &&
        window.AppInventor.setWebViewString
    ) {

        window.AppInventor.setWebViewString(
            "BACK"
        );

        return;

    }


    if (window.history.length > 1) {

        window.history.back();

    } else {

        window.location.href =
            "index.html";

    }

}

</script>


</body>

</html>
