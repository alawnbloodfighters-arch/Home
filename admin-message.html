<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="HandheldFriendly" content="true">

<title>AABF Messages</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #eeeae2;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow-x: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}


/* ==============================
   HEADER
============================== */

.header {

    width: 100%;
    height: 60px;

    background: #086b61;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;

    font-weight: bold;

}


/* ==============================
   CONTAINER
============================== */

.container {

    width: 100%;

    max-width: 620px;

    margin: auto;

    padding: 12px;
}


/* ==============================
   TITLE
============================== */

.title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 12px;

    color: #222;

}


/* ==============================
   STATUS
============================== */

.loading,
.empty,
.error {

    text-align: center;

    margin-top: 60px;

    color: #777;

    font-size: 15px;

    line-height: 1.6;

}

.error {

    color: #c62828;

}


/* ==============================
   USER CARD
============================== */

.user-card {

    width: 100%;

    background: white;

    border-radius: 15px;

    margin-bottom: 10px;

    padding: 12px;

    display: flex;

    align-items: center;

    gap: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.10);

    cursor: pointer;

    transition: transform .1s;

}

.user-card:active {

    transform: scale(.98);

}


/* ==============================
   AVATAR
============================== */

.avatar {

    width: 50px;
    height: 50px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #086b61;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 23px;

    font-weight: bold;

}


/* ==============================
   USER INFO
============================== */

.user-info {

    flex: 1;

    min-width: 0;

}


.user-name {

    font-size: 17px;

    font-weight: bold;

    color: #222;

    margin-bottom: 4px;

}


.user-uid {

    font-size: 10px;

    color: #999;

    margin-bottom: 4px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


.last-message {

    font-size: 14px;

    color: #777;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;

}


/* ==============================
   TIME
============================== */

.message-time {

    flex-shrink: 0;

    font-size: 11px;

    color: #888;

}


/* ==============================
   UNREAD
============================== */

.unread {

    background: #e8f8f5;

}


</style>

</head>


<body>


<!-- ==============================
     HEADER
============================== -->

<div class="header">

    💬 AABF Team Messages

</div>



<!-- ==============================
     MAIN
============================== -->

<div class="container">

    <div class="title">

        📩 ইউজারদের মেসেজ

    </div>


    <div id="userList">

        <div class="loading">

            মেসেজ লোড হচ্ছে...

        </div>

    </div>

</div>



<script type="module">


/* =========================================
   FIREBASE APP
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


/* =========================================
   FIREBASE AUTH
========================================= */

import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


/* =========================================
   FIREBASE DATABASE
========================================= */

import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAR3uyMlvGNwZaG_w1zs6IKQ2lXB_Y_9M0",

    authDomain:
        "al-awn-blood-fighters.firebaseapp.com",

    projectId:
        "al-awn-blood-fighters",

    storageBucket:
        "al-awn-blood-fighters.firebasestorage.app",

    messagingSenderId:
        "299061496611",

    appId:
        "1:299061496611:web:4762f74dbf311cd57f1a96",

    measurementId:
        "G-D31EXKJWQ3"

};



/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);



/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UIDS = [

    "TAWXxissVvXqHVK9gCrdxzM9Qjf2",

    "y3HwNswW8wYIi6GOEbZauIhcyis1"

];



/* =========================================
   ELEMENT
========================================= */

const userList =
    document.getElementById("userList");



/* =========================================
   TIME
========================================= */

function formatTime(timestamp) {

    if (!timestamp) {

        return "";

    }


    const date =
        new Date(timestamp);


    let hours =
        date.getHours();


    const minutes =
        String(
            date.getMinutes()
        ).padStart(2, "0");


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12 || 12;


    return (
        hours +
        ":" +
        minutes +
        " " +
        ampm
    );

}



/* =========================================
   CREATE ERROR
========================================= */

function showError(text) {

    userList.innerHTML = "";

    const div =
        document.createElement("div");

    div.className =
        "error";

    div.textContent =
        text;

    userList.appendChild(div);

}



/* =========================================
   CREATE EMPTY
========================================= */

function showEmpty() {

    userList.innerHTML = "";

    const div =
        document.createElement("div");

    div.className =
        "empty";

    div.textContent =
        "এখনো কোনো User মেসেজ করেনি।";

    userList.appendChild(div);

}



/* =========================================
   LOAD ALL USER CHATS
========================================= */

function loadChats() {

    const messagesRef =
        ref(
            db,
            "messages"
        );


    onValue(

        messagesRef,

        snapshot => {

            const data =
                snapshot.val();


            if (!data) {

                showEmpty();

                return;

            }


            const users = [];


            /*
             * DATABASE STRUCTURE:
             *
             * messages
             *    USER_UID
             *       MESSAGE_ID
             *           text
             *           senderUid
             *           senderType
             *           timestamp
             */


            Object.entries(data)
                .forEach(
                    ([uid, messages]) => {


                        if (!messages) {

                            return;

                        }


                        const messageArray =
                            Object.values(messages);


                        if (
                            messageArray.length === 0
                        ) {

                            return;

                        }


                        /*
                         * সর্বশেষ মেসেজ
                         */

                        messageArray.sort(

                            (a, b) =>

                                (
                                    b.timestamp || 0
                                )
                                -
                                (
                                    a.timestamp || 0
                                )

                        );


                        const latest =
                            messageArray[0];


                        users.push({

                            uid:
                                uid,

                            latest:
                                latest,

                            timestamp:
                                latest.timestamp || 0,

                            count:
                                messageArray.length

                        });

                    }
                );


            /*
             * নতুন মেসেজ আগে
             */

            users.sort(

                (a, b) =>

                    b.timestamp -
                    a.timestamp

            );


            if (users.length === 0) {

                showEmpty();

                return;

            }


            /*
             * CLEAR LIST
             */

            userList.innerHTML = "";


            /*
             * CREATE USER CARDS
             */

            users.forEach(

                user => {


                    const card =
                        document.createElement(
                            "div"
                        );


                    card.className =
                        "user-card";


                    /*
                     * সর্বশেষ মেসেজ
                     */

                    const latestText =
                        user.latest.text ||
                        "মেসেজ";


                    /*
                     * Avatar
                     */

                    const avatar =
                        document.createElement(
                            "div"
                        );

                    avatar.className =
                        "avatar";

                    avatar.textContent =
                        "👤";


                    /*
                     * User Info
                     */

                    const info =
                        document.createElement(
                            "div"
                        );

                    info.className =
                        "user-info";


                    /*
                     * User Name
                     */

                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "user-name";

                    name.textContent =
                        "User";


                    /*
                     * UID
                     */

                    const uidText =
                        document.createElement(
                            "div"
                        );

                    uidText.className =
                        "user-uid";

                    uidText.textContent =
                        user.uid;


                    /*
                     * Last Message
                     */

                    const lastMessage =
                        document.createElement(
                            "div"
                        );

                    lastMessage.className =
                        "last-message";


                    if (
                        ADMIN_UIDS.includes(
                            user.latest.senderUid
                        )
                    ) {

                        lastMessage.textContent =
                            "কর্তৃপক্ষ: " +
                            latestText;

                    } else {

                        lastMessage.textContent =
                            latestText;

                    }


                    /*
                     * Info append
                     */

                    info.appendChild(
                        name
                    );

                    info.appendChild(
                        uidText
                    );

                    info.appendChild(
                        lastMessage
                    );


                    /*
                     * Time
                     */

                    const time =
                        document.createElement(
                            "div"
                        );

                    time.className =
                        "message-time";

                    time.textContent =
                        formatTime(
                            user.timestamp
                        );


                    /*
                     * Card append
                     */

                    card.appendChild(
                        avatar
                    );

                    card.appendChild(
                        info
                    );

                    card.appendChild(
                        time
                    );


                    /*
                     * OPEN CHAT
                     */

                    card.addEventListener(

                        "click",

                        function() {

                            window.location.href =
                                "message.html?uid=" +
                                encodeURIComponent(
                                    user.uid
                                );

                        }

                    );


                    /*
                     * Add card
                     */

                    userList.appendChild(
                        card
                    );

                }

            );

        },


        error => {

            console.error(
                "Firebase Messages Error:",
                error
            );


            showError(
                "মেসেজ লোড করা যাচ্ছে না। Firebase Rules অথবা Login পরীক্ষা করুন।"
            );

        }

    );

}



/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(

    auth,

    user => {


        /*
         * LOGIN নেই
         */

        if (!user) {

            showError(
                "Admin Login করা হয়নি।"
            );

            return;

        }


        /*
         * ADMIN CHECK
         */

        const isAdmin =
            ADMIN_UIDS.includes(
                user.uid
            );


        if (!isAdmin) {

            showError(
                "এই পেজ শুধুমাত্র Admin-এর জন্য।"
            );

            return;

        }


        /*
         * ADMIN OK
         */

        loadChats();

    }

);


</script>


</body>

</html>
