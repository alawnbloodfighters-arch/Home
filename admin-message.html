<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="HandheldFriendly" content="true">

<title>AABF Messages</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    min-height: 100%;

    background: #eeeae2;

    font-family:
        Arial,
        "Noto Sans Bengali",
        sans-serif;

    overflow-x: hidden;

    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}

.header {

    width: 100%;
    height: 60px;

    background: #086b61;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 21px;

    font-weight: bold;
}

.container {

    width: 100%;

    max-width: 620px;

    margin: auto;

    padding: 12px;
}

.title {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 12px;

    color: #222;
}

.loading,
.empty,
.error {

    text-align: center;

    margin-top: 60px;

    color: #777;

    font-size: 15px;

    line-height: 1.6;
}

.error {

    color: #c62828;
}

.user-card {

    width: 100%;

    background: white;

    border-radius: 15px;

    margin-bottom: 10px;

    padding: 12px;

    display: flex;

    align-items: center;

    gap: 12px;

    box-shadow:
        0 3px 12px rgba(0,0,0,0.10);

    cursor: pointer;
}

.user-card:active {

    transform: scale(.98);
}

.avatar {

    width: 48px;
    height: 48px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #086b61;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 22px;

    font-weight: bold;
}

.user-info {

    flex: 1;

    min-width: 0;
}

.user-name {

    font-size: 16px;

    font-weight: bold;

    color: #222;

    margin-bottom: 4px;
}

.last-message {

    font-size: 14px;

    color: #777;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.message-time {

    flex-shrink: 0;

    font-size: 11px;

    color: #888;

}

.unread {

    background: #e8f8f5;
}

</style>

</head>


<body>


<div class="header">

    💬 AABF Team Messages

</div>


<div class="container">

    <div class="title">

        📩 ইউজারদের মেসেজ

    </div>


    <div id="userList">

        <div class="loading">

            মেসেজ লোড হচ্ছে...

        </div>

    </div>

</div>



<script type="module">


/* =========================================
   FIREBASE
========================================= */

import {
    initializeApp
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
    getAuth,
    onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


import {
    getDatabase,
    ref,
    onValue
}
from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";



/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyAR3uyMlvGNwZaG_w1zs6IKQ2lXB_Y_9M0",

    authDomain:
        "al-awn-blood-fighters.firebaseapp.com",

    projectId:
        "al-awn-blood-fighters",

    storageBucket:
        "al-awn-blood-fighters.firebasestorage.app",

    messagingSenderId:
        "299061496611",

    appId:
        "1:299061496611:web:4762f74dbf311cd57f1a96",

    measurementId:
        "G-D31EXKJWQ3"
};



/* =========================================
   INITIALIZE
========================================= */

const app =
    initializeApp(firebaseConfig);


const auth =
    getAuth(app);


const db =
    getDatabase(app);



/* =========================================
   ADMIN UID
========================================= */

const ADMIN_UIDS = [

    "TAWXxissVvXqHVK9gCrdxzM9Qjf2",

    "y3HwNswW8wYIi6GOEbZauIhcyis1"

];



/* =========================================
   ELEMENT
========================================= */

const userList =
    document.getElementById("userList");



/* =========================================
   TIME
========================================= */

function formatTime(timestamp) {

    if (!timestamp) {

        return "";

    }


    const date =
        new Date(timestamp);


    let hours =
        date.getHours();


    const minutes =
        String(
            date.getMinutes()
        ).padStart(2, "0");


    const ampm =
        hours >= 12
            ? "PM"
            : "AM";


    hours =
        hours % 12 || 12;


    return (
        hours +
        ":" +
        minutes +
        " " +
        ampm
    );

}



/* =========================================
   LOAD ALL CHATS
========================================= */

function loadChats() {

    const messagesRef =
        ref(
            db,
            "messages"
        );


    onValue(

        messagesRef,

        snapshot => {

            const data =
                snapshot.val();


            userList.innerHTML = "";


            if (!data) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "empty";

                empty.textContent =
                    "এখনো কোনো User মেসেজ করেনি।";

                userList.appendChild(
                    empty
                );

                return;
            }


            const users = [];


            /*
             * messages/
             *     USER_UID/
             *         messageID/
             *             text
             *             senderUid
             *             timestamp
             */

            Object.entries(data)
                .forEach(
                    ([uid, messages]) => {


                        if (!messages) {

                            return;

                        }


                        const messageArray =
                            Object.values(messages);


                        if (
                            messageArray.length === 0
                        ) {

                            return;

                        }


                        /*
                         * সর্বশেষ মেসেজ
                         */

                        messageArray.sort(
                            (a, b) =>
                                (b.timestamp || 0) -
                                (a.timestamp || 0)
                        );


                        const latest =
                            messageArray[0];


                        users.push({

                            uid:
                                uid,

                            latest:
                                latest,

                            timestamp:
                                latest.timestamp || 0

                        });

                    }
                );


            /*
             * নতুন মেসেজ আগে
             */

            users.sort(
                (a, b) =>
                    b.timestamp -
                    a.timestamp
            );


            if (users.length === 0) {

                const empty =
                    document.createElement("div");

                empty.className =
                    "empty";

                empty.textContent =
                    "এখনো কোনো User মেসেজ করেনি।";

                userList.appendChild(
                    empty
                );

                return;

            }


            /*
             * USER CARD
             */

            users.forEach(
                user => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "user-card";


                    /*
                     * Avatar
                     */

                    const avatar =
                        document.createElement("div");

                    avatar.className =
                        "avatar";

                    avatar.textContent =
                        "👤";


                    /*
                     * Info
                     */

                    const info =
                        document.createElement("div");

                    info.className =
                        "user-info";


                    const name =
                        document.createElement("div");

                    name.className =
                        "user-name";

                    name.textContent =
                        "User";


                    const lastMessage =
                        document.createElement("div");

                    lastMessage.className =
                        "last-message";


                    const senderIsAdmin =
                        ADMIN_UIDS.includes(
                            user.latest.senderUid
                        );


                    if (senderIsAdmin) {

                        lastMessage.textContent =
                            "কর্তৃপক্ষ: " +
                            (
                                user.latest.text ||
                                ""
                            );

                    } else {

                        lastMessage.textContent =
                            user.latest.text ||
                            "";

                    }


                    info.appendChild(
                        name
                    );

                    info.appendChild(
                        lastMessage
                    );


                    /*
                     * Time
                     */

                    const time =
                        document.createElement("div");

                    time.className =
                        "message-time";

                    time.textContent =
                        formatTime(
                            user.timestamp
                        );


                    /*
                     * Card
                     */

                    card.appendChild(
                        avatar
                    );

                    card.appendChild(
                        info
                    );

                    card.appendChild(
                        time
                    );


                    /*
                     * OPEN CHAT
                     */

                    card.addEventListener(
                        "click",
                        function() {

                            window.location.href =
                                "message.html?uid=" +
                                encodeURIComponent(
                                    user.uid
                                );

                        }
                    );


                    userList.appendChild(
                        card
                    );

                }
            );

        },

        error => {

            console.error(
                "Firebase Error:",
                error
            );


            userList.innerHTML = "";

            const errorDiv =
                document.createElement("div");

            errorDiv.className =
                "error";

            errorDiv.textContent =
                "মেসেজ লোড করা যাচ্ছে না।";

            userList.appendChild(
                errorDiv
            );

        }

    );

}



/* =========================================
   AUTH CHECK
========================================= */

onAuthStateChanged(

    auth,

    user => {

        if (!user) {

            userList.innerHTML = "";

            const error =
                document.createElement("div");

            error.className =
                "error";

            error.textContent =
                "Admin Login করা হয়নি।";

            userList.appendChild(
                error
            );

            return;
        }


        /*
         * শুধুমাত্র ২ জন Admin
         */

        if (
            !ADMIN_UIDS.includes(
                user.uid
            )
        ) {

            userList.innerHTML = "";

            const error =
                document.createElement("div");

            error.className =
                "error";

            error.textContent =
                "এই পেজ শুধুমাত্র Admin-এর জন্য।";

            userList.appendChild(
                error
            );

            return;
        }


        /*
         * Admin হলে
         * সব User-এর chat load হবে
         */

        loadChats();

    }

);

</script>


</body>

</html>
